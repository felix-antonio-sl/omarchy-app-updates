[package]
name = "omarchy-app-updates"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native Omarchy desktop application update manager"

[dependencies]
crc32fast = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["blocking", "json", "gzip"] }
rustix = { version = "1.1", features = ["fs", "process", "event", "time"] }

[build-dependencies]
sha2 = "0.10"
bindgen = "0.73"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

