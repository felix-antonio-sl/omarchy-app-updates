[package]
name = "omarchy-app-updates"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native Omarchy desktop application update manager"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

